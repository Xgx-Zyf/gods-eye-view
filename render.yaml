services:
  - type: web
    name: gods-eye-view
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: HOST
        value: 0.0.0.0
      - key: PUPPETEER_SKIP_DOWNLOAD
        value: 'true'
    healthCheckPath: /
